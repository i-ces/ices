name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.1.34
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun lint
      - name: Format (check)
        run: bun run format:check
      - name: Test
        run: bun test
      - name: Build
        run: bun build