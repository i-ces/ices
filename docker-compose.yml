version: "3.9"
services:
  mongo:
    image: mongo:7
    container_name: ices_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ices

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ices_api
    depends_on:
      - mongo
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/ices
      PORT: 4000
    ports:
      - "4000:4000"
    command: ["bun", "run", "dev"]
    volumes:
      - .:/workspace:delegated
    working_dir: /workspace/apps/api

  web:
    image: oven/bun:1
    container_name: ices_web
    depends_on:
      - api
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    command: ["bun", "run", "dev"]
    volumes:
      - .:/workspace:delegated
    working_dir: /workspace/apps/web

volumes:
  mongo_data: